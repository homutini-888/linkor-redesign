<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛИНКОР — депозитарий</title>
<meta name="description" content="ООО «ЛИНКОР» — депозитарий, профессиональный участник рынка ценных бумаг. Лицензия Банка России № 045-14295-000100.">
<link rel="canonical" href="https://link-or.ru/">
<meta property="og:type" content="website">
<meta property="og:title" content="ЛИНКОР — депозитарий">
<meta property="og:url" content="https://link-or.ru/">
<meta property="og:image" content="https://link-or.ru/assets/logo.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --navy:#0E3178;
  --blue:#0083CB;
  --blue-ink:#006BA6;
  --blue-soft:#EAF4FB;
  --ink:#101B2E;
  --text:#2E3A4D;
  --muted:#667386;
  --line:#E2E7EE;
  --soft:#F5F7FA;
  --bg:#FFFFFF;
  --ok:#2F7D4F;
  --warn:#9A6200;
  --warn-soft:#FFF4DE;
  --radius:14px;
  --wrap:1200px;
  --gutter:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html{scroll-behavior:auto;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--blue-ink);text-decoration:none}
a:hover{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
h1,h2,h3{color:var(--ink);font-weight:600;margin:0}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Header */
.header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.header .wrap{display:flex;align-items:center;gap:32px;height:72px}
.logo{display:block;flex:none}
.logo img{display:block;height:28px;width:auto}
.nav{display:flex;gap:28px;margin-right:auto}
.nav a{color:var(--text);font-weight:500;font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--blue-ink);text-decoration:none}
.header-contact{display:flex;align-items:center;gap:20px}
.header-phone{color:var(--ink);font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font:500 15px/1 inherit;font-family:inherit;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn:hover{text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-ink);color:#fff}
.btn-ghost{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue-ink)}
.menu{display:none}

/* Hero */
.hero{padding:72px 0 64px;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:start}
.eyebrow{display:inline-block;color:var(--blue-ink);font-weight:500;font-size:14px;letter-spacing:.02em;margin-bottom:20px}
.hero h1{font-size:clamp(32px,4.4vw,52px);line-height:1.08;letter-spacing:-.02em;max-width:14ch}
.lead{margin-top:24px;font-size:18px;line-height:1.6;color:var(--text);max-width:58ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.facts{background:var(--soft);border-radius:var(--radius);padding:8px 28px}
.fact{padding:20px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact-label{font-size:13px;color:var(--muted)}
.fact-value{margin-top:4px;color:var(--ink);font-weight:600;font-size:18px;line-height:1.35}
.fact-note{margin-top:2px;font-size:14px;color:var(--muted)}

/* Sections */
.section{padding:80px 0}
.section + .section{border-top:1px solid var(--line)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:36px}
.section-head h2{font-size:clamp(26px,3vw,36px);line-height:1.15;letter-spacing:-.01em}
.section-head p{color:var(--muted);max-width:52ch}

/* About */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:56px}
.about h2{font-size:clamp(26px,3vw,36px);line-height:1.15;letter-spacing:-.01em}
.principles{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.principles li{padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);font-weight:500;font-size:17px}
.principles li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--blue);margin-right:14px;vertical-align:2px}
.about-text{font-size:18px;line-height:1.65;max-width:68ch}
.about-text p + p{margin-top:20px}

/* Accounts */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.card-kicker{font-size:13px;color:var(--muted)}
.card h3{font-size:19px;line-height:1.3}
.card p{font-size:15px;color:var(--muted)}
.card .more{margin-top:auto;padding-top:8px;font-weight:500;font-size:15px}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick .doc{padding:18px;border:1px solid var(--line);border-radius:12px}
.quick .doc:hover{border-color:var(--blue);background:var(--bg)}

/* Docs */
.doc{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:10px;color:var(--text)}
.doc:hover{background:var(--soft);text-decoration:none;color:var(--text)}
.doc:hover .doc-title{color:var(--blue-ink)}
.ext{flex:none;width:44px;padding:4px 0;border-radius:6px;background:var(--blue-soft);color:var(--blue-ink);font:600 11px/1.2 inherit;font-family:inherit;text-align:center;letter-spacing:.04em;margin-top:2px}
.ext.pdf{background:#FDECEC;color:#B4342D}
.ext.url{background:var(--soft);color:var(--muted)}
.doc-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.doc-title{color:var(--ink);font-weight:500;line-height:1.4}
.doc-meta{font-size:14px;color:var(--muted)}
.tag{flex:none;align-self:center;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:#E8F5EE;color:var(--ok)}

/* Disclosure */
.disclosure{display:grid;grid-template-columns:280px minmax(0,1fr);gap:48px;align-items:start}
.toc{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto;padding-right:8px}
.toc-title{font-size:13px;color:var(--muted);margin-bottom:10px}
.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:6px 0 6px 16px;margin-left:-1px;border-left:2px solid transparent;font-size:14px;line-height:1.35;color:var(--text)}
.toc a:hover{color:var(--blue-ink);text-decoration:none;border-left-color:var(--blue)}
.toc a.is-current{color:var(--blue-ink);border-left-color:var(--blue);font-weight:500}

.search{position:relative;margin-bottom:20px}
.search input{width:100%;height:52px;padding:0 16px 0 48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:400 16px/1 inherit;font-family:inherit;color:var(--ink)}
.search input::placeholder{color:#8B96A6}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-empty{display:none;padding:24px 0;color:var(--muted)}

.acc{border-bottom:1px solid var(--line)}
.acc:first-of-type{border-top:1px solid var(--line)}
.acc > summary{display:flex;align-items:center;gap:16px;padding:22px 4px;cursor:pointer;list-style:none}
.acc > summary::-webkit-details-marker{display:none}
.acc > summary h3{flex:1;font-size:18px;line-height:1.35;font-weight:500}
.acc > summary:hover h3{color:var(--blue-ink)}
.count{flex:none;font-size:13px;color:var(--muted);min-width:24px;text-align:right}
.plus{flex:none;position:relative;width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:var(--ink);transform:translate(-50%,-50%)}
.plus::after{transform:translate(-50%,-50%) rotate(90deg)}
.acc[open] > summary .plus{background:var(--ink);border-color:var(--ink)}
.acc[open] > summary .plus::before{background:#fff}
.acc[open] > summary .plus::after{display:none}
.acc-body{padding:0 4px 28px}
.acc-body > p,.acc-body > .note{max-width:72ch}
.acc-body > * + *{margin-top:12px}
.note{color:var(--muted);font-size:15px}

.sub{border:1px solid var(--line);border-radius:12px;margin-top:10px}
.sub > summary{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;list-style:none;font-weight:500;color:var(--ink)}
.sub > summary::-webkit-details-marker{display:none}
.sub > summary::after{content:"";flex:none;margin:0 4px 0 8px;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-3px)}
.sub[open] > summary::after{transform:rotate(-135deg) translateX(-3px)}
.sub > summary .count{margin-left:auto}
.sub-body{padding:0 6px 8px}
.sub-body .doc{padding:9px 12px}
.sub-note{padding:4px 12px 8px}
.docs > .doc + .sub,.docs > .sub:first-child{margin-top:0}
.acc-body p + p{margin-top:12px}
.visit p + p{margin-top:12px}

.kv{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);border-top:1px solid var(--line);margin:0}
.kv dt,.kv dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:15px;padding-right:24px}
.kv dd{color:var(--ink)}

.status{display:grid;gap:0;border-top:1px solid var(--line)}
.status > div{display:flex;justify-content:space-between;gap:24px;padding:12px 0;border-bottom:1px solid var(--line)}
.status span:first-child{color:var(--text)}
.status span:last-child{color:var(--muted);white-space:nowrap}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.callout{padding:18px 20px;border-radius:12px;background:var(--blue-soft);color:var(--ink)}

/* Contacts */
.contacts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
.contact-label{font-size:13px;color:var(--muted)}
.contact-value{margin-top:4px;font-size:18px;color:var(--ink);font-weight:500}
.contact-value a{color:var(--ink)}
.contact-value a:hover{color:var(--blue-ink)}
.contact-sub{font-size:14px;color:var(--muted);margin-top:2px}
.visit{background:var(--soft);border-radius:var(--radius);padding:28px}
.visit h3{font-size:19px;margin-bottom:12px}
.visit p + p{margin-top:12px}
.visit .btn{margin-top:24px}

/* Footer */
.footer{background:var(--navy);color:#C8D3E8;padding:48px 0 40px;font-size:14px}
.footer .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:40px}
.footer strong{display:block;color:#fff;font-weight:500;margin-bottom:8px;font-size:15px}
.footer a{color:#fff}
.footer p + p{margin-top:6px}
.footer-bottom{grid-column:1/-1;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);color:#9FB0CF}

/* Responsive */
@media (max-width:1240px){
  .nav{gap:20px}
  .header-phone{display:none}
}
@media (max-width:1080px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero{padding:48px 0}
  .hero .wrap{grid-template-columns:1fr;gap:36px}
  .disclosure{grid-template-columns:minmax(0,1fr);gap:24px}
  .toc{position:static;max-height:none;padding:0}
  .toc ol{display:flex;gap:8px;overflow-x:auto;border:0;padding-bottom:6px}
  .toc li{flex:none}
  .toc a{border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin:0;white-space:nowrap}
  .toc a:hover,.toc a.is-current{border-color:var(--blue)}
  .contacts{grid-template-columns:1fr;gap:32px}
  .about{grid-template-columns:1fr;gap:24px}
  .principles{margin-top:20px}
  .quick{grid-template-columns:1fr 1fr}
  .footer .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .nav,.header-contact .btn{display:none}
  .header .wrap{height:64px;justify-content:space-between}
  html{scroll-padding-top:76px}
  .menu{display:block;position:relative}
  .menu > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font-weight:500;color:var(--ink)}
  .menu > summary::-webkit-details-marker{display:none}
  .menu-panel{position:absolute;right:0;top:48px;width:min(280px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 12px 32px rgba(16,27,46,.08)}
  .menu-panel a{display:block;padding:12px;color:var(--ink);font-weight:500;border-radius:8px}
  .menu-panel a:hover{background:var(--soft);text-decoration:none}
  .menu-panel .menu-phone{border-top:1px solid var(--line);margin-top:4px;border-radius:0;padding-top:16px}
  .section{padding:56px 0}
  .section-head{display:block;margin-bottom:28px}
  .section-head p{margin-top:10px}
  .cards,.quick{grid-template-columns:1fr}
  .card{padding:20px}
  .facts{padding:4px 20px}
  .lead{font-size:17px}
  .about-text{font-size:17px}
  .kv{grid-template-columns:1fr}
  .kv dt{padding-bottom:0;border-bottom:0;font-size:14px}
  .kv dd{padding-top:4px}
  .acc > summary{padding:18px 0;gap:12px}
  .acc > summary h3{font-size:16px}
  .acc-body{padding:0 0 24px}
  .doc{padding:12px 8px;gap:12px}
  .doc .tag{display:none}
  .doc .tag.warn{display:inline-block;align-self:flex-start}
  .contact-grid{grid-template-columns:1fr;gap:20px}
  .visit{padding:22px}
  .footer .wrap{grid-template-columns:1fr;gap:28px}
  .status > div{flex-direction:column;gap:2px}
  th,td{padding:12px 10px}
}
</style>
</head>

<header class="header">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="ЛИНКОР — на главную"><img src="assets/logo.png" alt="ЛИНКОР" width="141" height="28"></a>
    <nav class="nav" id="nav" aria-label="Основное меню"></nav>
    <div class="header-contact">
      <a class="header-phone" id="hdrPhone"></a>
      <a class="btn btn-ghost" id="hdrMail">Написать</a>
    </div>
    <details class="menu">
      <summary>Меню</summary>
      <div class="menu-panel" id="menuPanel"></div>
    </details>
  </div>
</header>

<main id="top">

<section class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow" id="heroEyebrow"></span>
      <h1 id="heroTitle"></h1>
      <div id="heroLead"></div>
      <div class="hero-actions" id="heroButtons"></div>
    </div>
    <aside class="facts" id="heroFacts" aria-label="Ключевые сведения"></aside>
  </div>
</section>

<section class="section" id="about">
  <div class="wrap about">
    <div>
      <h2 id="aboutTitle"></h2>
      <ul class="principles" id="aboutPrinciples" aria-label="Принципы компании"></ul>
    </div>
    <div class="about-text" id="aboutText"></div>
  </div>
</section>

<section class="section" id="accounts">
  <div class="wrap">
    <div class="section-head"><h2 id="accountsTitle"></h2><p id="accountsIntro"></p></div>
    <div class="cards" id="accountsCards"></div>
  </div>
</section>

<section class="section" id="disclosure">
  <div class="wrap">
    <div class="section-head"><h2 id="disclosureTitle"></h2><p id="disclosureIntro"></p></div>

    <div class="disclosure">
      <nav class="toc" aria-label="Разделы раскрытия">
        <div class="toc-title">Разделы</div>
        <ol id="toc"></ol>
      </nav>

      <div>
        <label class="search">
          <span class="visually-hidden">Поиск по разделам и документам</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Найти раздел или документ, например «анкета» или «R01»" autocomplete="off">
        </label>
        <p class="search-empty" id="empty">Ничего не найдено. Попробуйте другое слово или код формы.</p>
        <div id="sections"></div>
      </div>
    </div>
  </div>
</section>

<section class="section" id="contacts">
  <div class="wrap">
    <div class="section-head"><h2 id="contactsTitle"></h2></div>
    <div class="contacts">
      <div class="contact-grid" id="contactGrid"></div>
      <div class="visit" id="visit"></div>
    </div>
  </div>
</section>

</main>

<footer class="footer">
  <div class="wrap" id="footer"></div>
</footer>
